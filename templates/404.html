<!DOCTYPE html>
<html lang="en">
<head>
    <title>404 Not Found</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            background: #fff;
            color: #111;
            overflow: hidden;
            position: relative;
        }

        .watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(12rem, 40vw, 28rem);
            font-weight: 800;
            line-height: 1;
            color: #000;
            opacity: 0.08;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: left;
        }

        .content h1 {
            font-size: 3rem;
        }

        .content p {
            font-size: clamp(1.5rem, 3vw, 2.25rem);
            margin-bottom: 1rem;
        }

        .content a {
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="watermark" aria-hidden="true">404</div>
    <div class="content">
        <h1>OOOPS!!</h1>
        <p>This seems like a dead end :(</p>
        <p><a href="{{ url_for('home') }}">Back to home</a></p>
    </div>
</body>
</html>
