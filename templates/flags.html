{% extends "layout.html" %}

{% block preload_assets %}false{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='flag/style.css') }}">
<script type="module" src="{{ url_for('static', filename='flag/script.js') }}"></script>
{% endblock %}

{% block body %}
<div class="flag-page">
    <h1 class="flag-title">Feature flags</h1>
    <p class="flag-intro">Toggle experimental options for testing. Changes apply immediately and persist in this browser.</p>

    <!-- THis flag changes the design of the nav bar -->
    <label class="flag-option" for="legacy-nav-bar">
        <input type="checkbox" id="legacy-nav-bar" name="legacy-nav-bar">
        <span class="flag-option-text">
            <span class="flag-option-name">legacy-nav-bar</span>
            <span class="flag-option-desc">Legacy navbar: Reverse back to the transparent glassmorphism nav bar.</span>
        </span>
    </label>
</div>
{% endblock %}
