<!-- COFFEE MACHINE -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>218 I'm a coffee machine</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
        href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&family=Stack+Sans+Text:wght@200..700&display=swap"
        rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Stack Sans Text", "SN Pro", system-ui, sans-serif;
            background: #fff;
            color: #111;
            overflow: hidden;
            position: relative;
        }
        .watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }
        .watermark img {
            width: clamp(14rem, 48vw, 32rem);
            height: auto;
            opacity: 0.08;
        }
        .content { position: relative; z-index: 1; text-align: left; }
        .content h1 { font-size: 3rem; }
        .content p { font-size: clamp(1.5rem, 3vw, 2.25rem); margin-bottom: 1rem; }
        .content a { font-size: 1.25rem; }
    </style>
</head>
<body>
    <div class="watermark" aria-hidden="true">
        <img src="{{ url_for('static', filename='assets/coffeemachine.svg') }}" alt="">
    </div>
    <div class="content">
        <h1>I'm a coffee machine</h1>
        <p>I brew coffee. This one is for you. 🍵</p>
        <p><a href="{{ url_for('home') }}">Back to home</a></p>
    </div>
</body>
</html>
