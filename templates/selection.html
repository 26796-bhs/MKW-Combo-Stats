{% extends "layout.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='selection/style.css') }}">
<script type="module" src="{{ url_for('static', filename='selection/script.js') }}"></script>
{% endblock %}

{% block body %}
<div class="base-card">
    <div class="selection-panel">
        <div class="map-preview">
            <img class="map-preview-img" id="map-preview-img" alt="Selected map preview" referrerpolicy="no-referrer">
        </div>
        <div class="combo-panel">
            <p class="combo-title">Best combo for this map:</p>
            <hr class="combo-divider">
            <div class="prioritize">
                <label class="prioritize-label" for="priority-select">Prioritize:</label>
                <select id="priority-select" class="priority-select">
                    <option value="Speed">Speed</option>
                    <option value="Turbo">Turbo</option>
                </select>
            </div>
            <div class="selection-combo">
                <div class="combo-item">
                    <div class="combo-pfp pfp-shape" id="best-character-img"></div>
                    <p class="combo-name" id="best-character-name">Character Name</p>
                </div>
                <div class="combo-item">
                    <div class="combo-pfp pfp-shape" id="best-vehicle-img"></div>
                    <p class="combo-name" id="best-vehicle-name">Vehicle Name</p>
                </div>
            </div>
        </div>
    </div>

    <div class="map-picker">
        <p class="picker-title">Maps</p>
        <hr class="picker-divider">
        <div class="maps-grid">
            {% for map in maps %}
            <div class="map-card" data-hiddenid="{{ map[0] }}"
                {% if map[9] %}data-imgurl="{{ map[9] }}"{% endif %}
                data-name="{{ map[1] }}">
                <img class="map-card-img pfp-shape"
                    src="{{ map[9] or '' }}"
                    alt="{{ map[1] }}"
                    loading="lazy"
                    referrerpolicy="no-referrer">
                <p class="map-card-name">{{ map[1] }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
